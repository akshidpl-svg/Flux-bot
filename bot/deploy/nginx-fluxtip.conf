# Public HTTPS front for the OrbChain webhook endpoint.
# Put this in /etc/nginx/sites-available/fluxtip and symlink into sites-enabled.
# TLS: sudo certbot --nginx -d bot.example.com
server {
    listen 80;
    listen [::]:80;
    server_name bot.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bot.example.com;

    ssl_certificate     /etc/letsencrypt/live/bot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.example.com/privkey.pem;

    # OrbChain payloads are small; reject anything larger before it reaches Node.
    client_max_body_size 256k;

    location /webhooks/orbchain {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The raw body must reach the bot untouched for HMAC-SHA512 verification.
        proxy_request_buffering off;
        proxy_read_timeout 15s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
        access_log off;
    }
}
